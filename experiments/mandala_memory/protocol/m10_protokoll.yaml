# YAML twin of m10_protokoll.json (generated; the JSON is authoritative)
"schema": "mandala-memory-m10-protocol-v1"
"status": "freeze-candidate, NOT frozen (research run blocked in code until the freeze hash is set)"
"plan": "docs/M10_PLAN_ABLENKUNG.md (Fassung 2); reviews ASTRA_REVIEW_M10_PLAN (R5-R8) and ASTRA_FOLLOWUP_R5_R8"
"question": "Does the identity of an original stimulus A/B stay readable when class-independent distractor pulses occur in the pause, and how do a modular and an equal-budget uniform network differ?"
"network":
  "N": 12
  "gamma": 0.8
  "ell": 0.5
  "inputs":
    [0, 4]
  "amplitude": 0.6
  "hebb": false
"networks":
  "modular":
    "M": 3
    "c": 0.25
  "uniform":
    "M": 1
"nonlinearities":
  "main": "tanh"
  "linear_twin": "identity"
"observation":
  "sigma": 0.02
  "H": "identity (all 12 nodes)"
  "noise": "iid Gaussian per node"
"window":
  "W": 3
  "position": "steps d-2 .. d, directly before the readout x_(d+1)"
  "p_pulse": 0.5
  "channel_given_pulse":
    "X": 0.5
    "Y": 0.5
  "n_patterns": 27
  "P_last":
    "X": "7/16"
    "Y": "7/16"
    "none": "1/8"
"conditions":
  "K0": null
  "F":
    "X": 8
    "Y": 10
    "amplitude": 0.6
  "N":
    "X": 1
    "Y": 5
    "amplitude": 0.6
  "Fplus":
    "X": 8
    "Y": 10
    "amplitude": 1.8
"delays":
  "primary": 4
  "all":
    [3, 4, 6]
  "matched_descriptive":
    "modular": 6
    "uniform": 3
"tasks":
  "preserve": "target class s in {A, B} from y; equal priors"
  "update": "channel of the LAST pulse in the window (X/Y) from the same y; patterns without pulse excluded (mass 1/8); conditional on >= 1 pulse the classes X/Y have equal prior; K0: not applicable (N/A, no value)"
"level_B":
  "definition": "acc_B = E_y[max_c P(c|y)], y from the equal-prior mixture of the class-conditional finite Gaussian mixtures"
  "preserve_likelihood": "p(y|s) = sum_pi P(pi) N(y; z(s,pi), sigma^2 I)"
  "update_likelihood": "p(y|L=l) = sum_s 1/2 sum_{pi: last(pi)=l} P(pi)/P(last=l) N(y; z(s,pi), sigma^2 I)"
  "K0_preserve": "analytic Phi(||z(A)-z(B)|| / 2 sigma), no Monte Carlo"
  "states": "z(s,pi) = x_(d+1) from the tested kernel (2 x 27 deterministic runs per network/condition/delay)"
  "n_mc": 2000000
  "block": 50000
  "streams":
    "mode": "m10bayes"
    "base_seed": 2026101001
    "names": "(task, network, nonlinearity, condition, delay); one independent stream per estimate"
  "numerics":
    ["log-sum-exp over components", "squared distances from centred coordinates, clipped at 0", "blockwise mean and M2 merged with Chan's formula; SE = sqrt(var/n)", "no data-dependent increase of n_mc", "non-finite posterior -> abort with status"]
  "error_sources":
    "statistical": "Monte Carlo, reported as SE"
    "approximation": "normal approximation of the MC mean in z tests and intervals"
    "rounding": "floating point; not part of SE"
"level_D":
  "role": "descriptive only (O11): how much a trained decoder reads out; does not confirm or refute level-B statements"
  "seeds":
    [31101, 31102, 31103, 31104, 31105, 31106, 31107, 31108, 31109, 31110, 31111, 31112, 31113, 31114, 31115, 31116, 31117, 31118, 31119, 31120]
  "n_train_per_class": 1000
  "n_test_per_class": 2000
  "decoders":
    ["nearest_mean (no standardisation, tie -> class 0)", "lda_ledoit_wolf (pooled within-class covariance, Ledoit-Wolf shrinkage to scaled identity, training data only, threshold at the midpoint)"]
  "streams":
    "mode": "m10"
    "names": "(seed, kind in {pattern, noise}, role in {decoder_train, test}, delay); identical across networks, nonlinearities and conditions (paired), disjoint across roles"
  "pairing": "within a split each pattern is used for one A and one B episode; across networks/conditions same patterns and noise per seed; the decoder sees only y"
  "bootstrap":
    "reps": 2000
    "seed": 2026101002
    "unit": "whole seed"
    "level": 0.95
"diagnostics":
  "A1":
    "what": "x_B(k) = P x_A(k) for all k and patterns, P-fixed sites"
    "tol_rel": 1.0e-14
    "applies":
      ["F and Fplus in both networks", "N in the uniform network"]
    "negative_control": "N in the modular network (must NOT hold)"
  "A2_structural":
    "what": "||P_- r(pi)|| <= tol for all patterns, linear twins, P-fixed sites"
    "tol": 1.0e-13
  "A2_numeric":
    "what": "|acc_B(cond) - acc_B(K0)| <= 4 SE, linear twins, P-fixed sites"
    "sides": 2
  "A3_numeric":
    "what": "acc_B(cond) <= acc_B(K0) + 4 SE, linear twins, all conditions"
    "sides": 1
  "alarm_policy": "A 4-SE exceedance is a STATISTICAL DIAGNOSTIC ALARM, not a proof of a programming error: it can occur by chance with a correct computation. Number of numeric checks fixed: A2_numeric 15 (5 per delay x 3), A3_numeric 18 (6 per delay x 3); expected chance alarms about 0.0015 in total. An alarm is reported with its value; it may trigger an investigation that is reported separately (e.g. one diagnostic re-computation with an independent, pre-named stream 'diagnostic-rerun'), but the original result stays the reported result. No repetition until a check passes. A1 and A2_structural are deterministic (floating-point tolerances), a violation there is reported as a failed check."
"confirmatory":
  "family":
    ["H-N", "H-F+"]
  "level": "B"
  "delay": 4
  "network_nonlinearity": "tanh"
  "interference": "I_n(b) = acc_B,n(K0) - acc_B,n(b)"
  "H-N":
    "H0": "I_modular(N) - I_uniform(N) <= delta"
    "H1": "> delta"
  "H-F+":
    "H0": "I_uniform(Fplus) - I_modular(Fplus) <= delta"
    "H1": "> delta"
  "delta": 0.01
  "delta_note": "pre-chosen practical minimum difference for this model, not a general relevance threshold (O9)"
  "statistic": "Z = (Delta_hat - delta) / SE(Delta_hat), SE = sqrt(SE_1^2 + SE_2^2) from independent MC streams (K0 terms analytic); p = 1 - Phi(Z)"
  "se_zero_rule": "if SE(Delta_hat) = 0: p = 0 if Delta_hat > delta else 1"
  "holm":
    "alpha": 0.05
    "rule": "order p; reject H(1) if p(1) <= 0.025; only then reject H(2) if p(2) <= 0.05"
  "report":
    ["point estimates", "Holm-adjusted p", "unadjusted two-sided 95% MC intervals, named as unadjusted"]
  "wording":
    "rejected": "bestaetigt"
    "not_rejected": "nicht bestaetigt (not 'widerlegt')"
    "contrary": "Richtung widerspricht der Hypothese, only if the unadjusted 95% interval lies entirely below 0"
  "uncertainty_meaning": "Monte Carlo uncertainty about a deterministic quantity of the fixed model; no population of networks or seeds"
  "release": "only for a complete research run with the frozen protocol (hash match), all streams and seeds present, no failures"
"descriptive":
  ["H-F: |I_n(F)| in both tanh networks (no TOST)", "level D for both tasks and both decoders: paired seed differences, 95% bootstrap over whole seeds, labelled unadjusted", "update task and any trade-off between preserving and updating", "normalised interference I / (acc_B(K0) - 1/2)", "matched comparison d = 6 (modular) vs d = 3 (uniform)", "common delays 3 and 6", "linear twins incl. A4"]
"exclusion":
  ["a failure in any sub-run (seed or MC stream) is logged; the run is then incomplete and nothing is confirmed", "update task: patterns/episodes without pulse are excluded; their number/mass is reported", "non-finite values abort with status, no silent repair", "no change of conditions, delays, decoders, n_mc, delta or alpha after the freeze"]
