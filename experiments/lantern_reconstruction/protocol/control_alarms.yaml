# YAML twin of control_alarms.json (generated; the JSON is authoritative)
schema: lantern-control-alarms-v2
status: development protocol (NOT frozen); v1 fixed before any run of these cells (LR5, 2026-10-08); v2 = correction of the permuted-target cells, decided by Johann on 2026-10-09 after the LR6 development acceptance alarm
source: plan v2.0 section 10 (empirical controls); review LANTERN_LR4_NACHREVIEW_25ba293 LR5-A1
revision:
  v2: 'investigation results/lantern/lr6_acceptance_investigation/UNTERSUCHUNG.md: a label-permuted decoder is a random map of features that encode the target (task A, early times), so its test predictions depend on the test targets and the fixed-prediction test fired by construction (only in permuted_targets|A|1.0); in addition lambda selection on REAL validation targets is a weak channel of target information. v2: validation targets are permuted too, and the four permuted-target cells use a refit null; reset and zero_impulse are unchanged'
cells:
  rule: control x task x tau, decoder Ridge, coupling condition lantern
  controls:
  - reset
  - zero_impulse
  - permuted_targets
  tasks:
  - A
  - B
  times:
  - 1.0
  - 5.0
  condition: lantern
  names: '''{control}|{task}|{tau}'', in exactly this nested order (controls, tasks, times) = Holm family order'
  count: 12
controls:
  reset: write, then reset to phi * 1 at once (encoding control 'reset'); full 7-time curves are reported
  zero_impulse: nothing is written (encoding control 'zero_impulse'); full 7-time curves are reported
  permuted_targets: states and features as in the main condition; the TRAINING targets are permuted by the decoder stream (study, context, train, decoder, 0, extra 2, task index, time index) and the VALIDATION targets by (study, context, val, decoder, 0, extra 3, task index, time index) before fit and lambda selection; test targets stay real; full 7-time curves are reported
statistic:
  per_cell: observed mean over the contexts of G (projected test predictions of the fitted control decoder)
  reset_and_zero_impulse: 'their features carry no target information: test targets permuted WITHIN each context, predictions fixed; B = 9999; one generator per cell (study, context 0, test, decoder, 0, extra 1, cell index), the contexts permuted from it in ascending order'
  permuted_targets: 'refit null: per context B = 9999 gains of the COMPLETE procedure with NEW train and val permutations (refit, lambda selection, test on the real targets), stream (study, context, train, decoder, 0, extra 4, task index, time index), computed during the run and stored as the cell''s null.npz; null statistic of draw b = mean over contexts of the b-th gains'
  p_value: p = (1 + b) / (1 + B), b = number of null statistics >= observed
  multiplicity: Holm over ALL 12 cells at 0.01, always; never only over a selected subset (e.g. the positive cells)
alarms:
  positive_spurious_success: any cell with observed G > 0 AND Holm-adjusted p <= 0.01 (the plan's alarm on unexpectedly positive G)
  target_dependence: 'any cell with Holm-adjusted p <= 0.01 regardless of the sign of G (reset/zero impulse: a control decoder that depends recognisably on the test target; permuted targets: a control decoder better than label-free refits, even when worse than the zero prediction)'
  reported: both alarms with every cell's G, p and Holm p, under these two separate names; never merged into one flag
release_rule:
  status: ENDORSED by Johann and Astra (REVIEW_LR5, 2026-10-09); becomes binding with the research freeze (LR6)
  proposal: either alarm sets scientifically_interpretable = false and blocks the scientific release until a documented investigation; a negative G does not make a target dependence harmless; technically_complete is unaffected by the alarms
  investigation: 'an investigation is no automatic override: finding, cause, consequences and, if needed, a new protocol version are documented'
  interpretation: both names denote the same directional test (per cell family its own null), with and without the additional condition G > 0; a missing alarm does not prove independence
  implemented_default: the release gate applies this rule (both alarms block)
