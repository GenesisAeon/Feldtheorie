trust_contract:
  research_entry: 'registry_adapter.load_verified_snapshot(): pins from SNAPSHOT_PIN in the reviewed code (canonical + manifest SHA-256), full repository checks'
  pins: canonical_pin and manifest_pin are mandatory arguments of load_snapshot (no defaults); the artifact never pins itself
  recomputed_not_trusted:
  - all structure values from the verified arrays (strengths, argmin/argmax, g, eigenvalues, edge counts)
  - kappa clip count from the independent formula (with repository)
  - permutation vs recorded YAML order and vs the registry
  - every node array and metadata field vs the registry
  - 'recorded sources: exactly the eleven pinned files; blob = LF = pinned baseline; with repository = current hashes; raw hashes informational only'
  strict_json: no duplicate keys, no NaN/Infinity
  exposed: only recomputed/verified values (structure, sources, ids, arrays, meta, permutation); build-time probe information as recorded_probe (authenticated by the manifest pin, not re-executed)
  immutability: arrays on immutable byte buffers (write flag cannot be re-enabled), read-only mapping views (also nested), frozen dataclass; working_copy() for the dynamics; verify() recomputes the canonical hash
  development_reader: 'read_snapshot_unverified(): labelled UNVERIFIED, no pins, never a research input'
