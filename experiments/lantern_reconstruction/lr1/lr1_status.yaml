    subprocess: 'one, during import: cmd.exe /c ver, caller numpy/testing/_private/utils.py:92 platform.machine() -> platform.win32_ver(); a third-party side effect of NumPy on Windows, not Lantern code'
    label: observed by sys.addaudithook; NOT a proof of absence and NOT an enforced isolation
