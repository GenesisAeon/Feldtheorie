  lf_sha256: CRLF->LF, declared text sources only; must equal the blob
  blob_sha256: git blob at HEAD; must equal the reviewed baseline (QUELLENINVENTAR)
  container_sha256: these NPZ bytes; an equal array set saved again may differ
  canonical_sha256: schema + IDs + node metadata + key/shape/'<f8' + C-order data; independent of the container (tested)
rejections_tested:
- missing source file
- blob differing from the baseline
- missing registry file for the probe
- matrix left in YAML order with sorted IDs (plan mutant 1, hashes made consistent)
- unsorted IDs
- probe IDs not in YAML order
- node array not permuted jointly
- NPZ byte flip (container)
- changed value with fixed container (canonical)
- changed value with both hashes fixed (independent formula)
- pinned canonical hash
- extra file
- float32
- NaN
- asymmetric C
- non-zero diagonal
- wrong shape
- pickled object array
- bool parameter in the YAML
- duplicate ID
- overwriting probe or snapshot
