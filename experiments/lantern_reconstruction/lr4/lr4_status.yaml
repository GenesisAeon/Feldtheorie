modules:
  training.py: Ridge closed form via NumPy SVD; objective (1/N)||XsW+1b^T-U||^2 + lambda||W||^2, intercept unpenalised; standardisation from train only (ddof 0, exactly constant column (by its values) mean = value, scale 1); grid 1e-4..100; selection by projected val MSE, exact tie -> larger lambda; no test argument
  decoders.py: RidgeDecoder; predict(model, X) sees only features; NPZ without pickle + strict JSON with canonical array identities; the stored lambda is re-derived from the stored val MSEs on load
  evaluate.py: test scoring; imports no fit function
  metrics.py: projection, episode losses, S and G separately (G may be negative), fixed grid aggregate A (K21), context inference (one value per context id, df = contexts - 1), t intervals (pointwise), degenerate case, H-B1/H-B2 + Holm, Bonferroni (.9875), permutation p, 12-cell leak alarm
  runner.py: development-only pipeline; features only via observation.observe(); one RK4 trajectory per split and condition
  episodes.simulate: optional dt only for the convergence check; default path unchanged
independent_controls:
  ridge_1d_fraction: w = 2/(1+lambda), b = 2 exact
