  lambda_convention: 1/N objective; unaveraged form needs alpha = N lambda (plan mutant 13)
  K19: S = .925, G = 0
  K20: Holm (.03, .04) -> (.06, .06)
  K21: closed-form weights ln1.5, ln2 (x4), ln(11/4), ln(11/6) over 2 ln 11; <= 1e-15
