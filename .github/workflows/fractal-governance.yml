name: Fractal Governance Engine

on:
  push:
    branches:
      - main
      - v5
      - 'claude/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  governance:
    name: Update Fractal Governance
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper git operations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run Fractal Governance Engine
        run: |
          python modules/champollion/scripts/fractal_governance.py

      - name: Check for governance changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No governance changes detected."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Governance changes detected:"
            git diff --stat
          fi

      - name: Commit governance updates
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: Update fractal governance [skip ci]

          - Auto-generated by Fractal Governance Engine
          - Propagated policies to subdirectories
          - Updated GOVERNANCE_REPORT.md
          - Governance version: $(grep 'GOVERNANCE_VERSION' modules/champollion/scripts/fractal_governance.py | head -n1 | cut -d'\"' -f2)"

      - name: Push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git push

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: GOVERNANCE_REPORT.md
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('GOVERNANCE_REPORT.md', 'utf8');
            const summary = report.split('---')[1] || 'See full report artifact.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🏛️ Fractal Governance Update

              The Fractal Governance Engine has updated policies in this PR.

              ${summary}

              📊 Full report available in workflow artifacts.`
            });
