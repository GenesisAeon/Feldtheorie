name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Type check (optional)
        run: mypy scripts || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=analysis --cov=models --cov=scripts \
            --cov-report=term-missing --cov-report=json --cov-report=xml
      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import json; f=open('coverage.json'); d=json.load(f); print(int(d['totals']['percent_covered']))")
          echo "Current coverage: ${COVERAGE}%"
          THRESHOLD=29
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
            .coverage
