name: CI

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check src tests
      - name: Run mypy
        # --explicit-package-bases: without it, mypy computes module names
        # relative to `src` itself (since src/ has no __init__.py but
        # src/scenarios/ does), giving "scenarios.X". But the codebase's
        # own imports consistently use the "src." prefix (e.g.
        # src/scenarios/level_7_cosmic_loop/run_eternal_cycle.py imports
        # `from src.scenarios.level_7_cosmic_loop.cosmic_physics import
        # ...`) - mypy then finds the same file resolved under both names
        # and refuses to check anything ("Source file found twice under
        # different module names"), which has blocked this step from
        # completing at all since before this repo's earliest recorded CI
        # history. This flag makes mypy treat the repo root as the
        # package base, matching how the code actually imports itself.
        run: mypy --explicit-package-bases src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs dependencies
        run: pip install -e ".[docs]"
      - name: Build docs
        run: mkdocs build --strict
