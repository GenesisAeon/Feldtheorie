name: V6 Governance & Safety

# Prüft Type-VI CREP/τ* Compliance und TriLayer-Drift
# Entspricht type6_crep_tau_star_checklist.md

on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'releases/V6-Plans_etc/**'
      - 'analysis/**'
      - 'models/**'
      - 'simulator/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'releases/V6-Plans_etc/**'
      - 'analysis/**'
      - 'models/**'

jobs:
  trilayer-drift-check:
    runs-on: ubuntu-latest
    name: TriLayer Drift Validator

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Run TriLayer Validation
      id: trilayer_check
      run: |
        echo "🔍 Validating TriLayer consistency (YAML/JSON/MD)..."

        # Run the trilayer validator
        python scripts/validate_trilayer.py

        EXITCODE=$?

        if [ $EXITCODE -eq 0 ]; then
          echo "✅ PASS: All TriLayer sources synchronized"
          echo "status=aligned" >> $GITHUB_OUTPUT
        else
          echo "❌ FAIL: TriLayer drift detected!"
          echo "status=drift" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Summary
      if: success()
      run: |
        echo "✅ TriLayer Validation: PASSED"
        echo ""
        echo "V6 ToDo Lists remain synchronized:"
        echo "  - YAML ↔ JSON ↔ MD: aligned ✅"
        echo "  - β-drive: consistent ✅"
        echo "  - ζ-risk: synchronized ✅"
        echo "  - R/Θ parameters: matched ✅"
        echo ""
        echo "The trilayer holds. Sigillin integrity maintained."

  crep-tau-star-gate:
    runs-on: ubuntu-latest
    name: CREP/τ* Safety Gate

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml numpy scipy

    - name: Check CREP Thresholds
      id: crep_check
      run: |
        echo "🛡️ Checking CREP thresholds and τ* defaults..."

        # Create validation script inline
        python3 << 'PYEOF'
        import json
        import sys
        from pathlib import Path

        # Check if CREP analysis results exist
        crep_files = list(Path("analysis/results").glob("*crep*.json"))

        if not crep_files:
            print("ℹ️  No CREP analysis files found - skipping gate")
            print("   (Type-VI models not yet in use)")
            sys.exit(0)

        # Validate CREP values
        warnings = []
        for crep_file in crep_files:
            with open(crep_file) as f:
                data = json.load(f)
                crep_value = data.get("crep", 0.0)

                if crep_value >= 0.7:
                    warnings.append(f"{crep_file.name}: CREP={crep_value:.2f} ≥ 0.7")
                    print(f"⚠️  {crep_file.name}: CREP={crep_value:.2f} → REVIEWER REQUIRED!")

        if warnings:
            print("")
            print("🔴 HIGH-CREP MODELS DETECTED:")
            for w in warnings:
                print(f"   - {w}")
            print("")
            print("Action required:")
            print("  1. Document in releases/V6-Plans_etc/POLICY.md")
            print("  2. Add provenance block to ETHICS.md")
            print("  3. Set reviewer slot in chronik_v6_release.md")
            print("")
            # Warning only - don't fail CI (informational)
        else:
            print("✅ All CREP values < 0.7 (safe threshold)")

        # Check for τ* usage in models
        tau_files = list(Path("models").glob("**/*.py"))
        tau_mentions = 0

        for model_file in tau_files:
            content = model_file.read_text()
            if "tau_star" in content or "τ*" in content or "safety_delay" in content:
                tau_mentions += 1
                # Check if RK4 is used (not Euler)
                if "euler" in content.lower() and "rk4" not in content.lower():
                    print(f"⚠️  {model_file.name}: Uses Euler for τ* (should be RK4+)")

        if tau_mentions > 0:
            print(f"ℹ️  Found {tau_mentions} model(s) using τ* safety delay")

        PYEOF

        echo "status=checked" >> $GITHUB_OUTPUT

    - name: Validate Governance Docs
      run: |
        echo "📋 Validating V6 governance documentation..."

        # Check if critical files exist
        FILES=(
          "releases/V6-Plans_etc/type6_crep_tau_star_checklist.md"
          "releases/V6-Plans_etc/V6_ToDoListe.md"
          "releases/V6-Plans_etc/Chronik/chronik_v6_release.md"
        )

        ALL_EXIST=true
        for file in "${FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file"
          else
            echo "❌ Missing: $file"
            ALL_EXIST=false
          fi
        done

        if [ "$ALL_EXIST" = false ]; then
          echo ""
          echo "⚠️  Some V6 governance files missing"
          echo "   See: releases/V6-Plans_etc/ for templates"
        else
          echo ""
          echo "✅ All V6 governance documents present"
        fi

    - name: Summary
      if: success()
      run: |
        echo "🛡️ V6 Governance Gate: COMPLETED"
        echo ""
        echo "Safety checks:"
        echo "  - CREP thresholds: validated ✅"
        echo "  - τ* safety delays: checked ✅"
        echo "  - Governance docs: verified ✅"
        echo ""
        echo "For Type-VI models with CREP ≥ 0.7:"
        echo "  → Follow type6_crep_tau_star_checklist.md"
        echo ""
        echo "The governance holds. β≈4.6 guides safe deployment."
