name: Guard Digital Physics

on:
  push:
    branches:
      - '**'

jobs:
  verify-hex-resonance:
    name: Verify HEX_RESONANCE_BETA integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Validate HEX_RESONANCE_BETA against digital-physics law
        run: |
          python - <<'PY'
          import math
          import sys

          try:
            from models.unified_constants import HEX_RESONANCE_BETA
          except Exception as exc:  # pragma: no cover - CI guard path
            print(f"Non-Resonant Physics Detected: unable to import HEX_RESONANCE_BETA ({exc})")
            sys.exit(1)

          expected = 16 ** (1 / math.sqrt(math.pi))
          delta = abs(HEX_RESONANCE_BETA - expected)
          if delta > 1e-12:
            print("Non-Resonant Physics Detected: HEX_RESONANCE_BETA drifted from 16^(1/sqrt(pi)).")
            print(f"Observed: {HEX_RESONANCE_BETA!r}")
            print(f"Expected: {expected!r}")
            print(f"Δ: {delta}")
            sys.exit(1)

          print("σ(β(R-Θ)) guard active — HEX_RESONANCE_BETA remains aligned.")
          PY
