name: narrative-science-sync

# Checks that narrative claims in docs/README stay backed by evidence artifacts.
# Posts an informational PR comment when drift is detected.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'analysis/results/**'
      - 'analysis/reports/**'
      - 'data/**'
      - 'docs/science/claim_evidence_registry.yaml'

jobs:
  check-claim-evidence:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run claim-evidence check
        id: claim_check
        run: |
          OUTPUT=$(python scripts/check_claim_evidence.py 2>&1) || true
          echo "$OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Set exit code for the step
          python scripts/check_claim_evidence.py --json > /tmp/claims.json 2>&1
          MISSING=$(python -c "import json; d=json.load(open('/tmp/claims.json')); print(d.get('missing_count', -1))")
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Comment on PR if drift detected
        if: steps.claim_check.outputs.missing != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.claim_check.outputs.output }}`;
            const missing = `${{ steps.claim_check.outputs.missing }}`;
            const body = `### Narrative/Science Sync Report

            **${missing} missing evidence artifact(s) detected.**

            Claims in \`docs/science/claim_evidence_registry.yaml\` reference artifacts that do not exist in this PR's tree. Please reconcile before merging.

            <details>
            <summary>Full check output</summary>

            \`\`\`
            ${output}
            \`\`\`
            </details>

            *This comment was generated by the narrative-science-sync workflow.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Fail if missing artifacts
        if: steps.claim_check.outputs.missing != '0'
        run: |
          echo "::warning::${{ steps.claim_check.outputs.missing }} claim(s) have missing evidence artifacts."
          # Informational only — does not block merge
          # To make this a hard gate, uncomment the next line:
          # exit 1
