name: doc-freshness-guard

on:
  push:
    paths:
      - 'scripts/**'
      - 'models/**'
      - 'analysis/**'
      - 'docs/science/**'
      - 'tests/**'
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'README.md'
  pull_request:
    paths:
      - 'scripts/**'
      - 'models/**'
      - 'analysis/**'
      - 'docs/science/**'
      - 'tests/**'
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'README.md'

jobs:
  check-doc-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check ARCHITECTURE.md freshness
        run: |
          MAX_AGE_DAYS=90

          # Get last modification date of ARCHITECTURE.md
          ARCH_DATE=$(git log -1 --format="%at" -- ARCHITECTURE.md)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - ARCH_DATE) / 86400 ))

          echo "ARCHITECTURE.md last modified: $AGE_DAYS days ago"

          if [ "$AGE_DAYS" -gt "$MAX_AGE_DAYS" ]; then
            echo "::warning::ARCHITECTURE.md is $AGE_DAYS days old (threshold: $MAX_AGE_DAYS). Consider updating."
          else
            echo "ARCHITECTURE.md is fresh ($AGE_DAYS days old, threshold: $MAX_AGE_DAYS)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check version consistency
        run: python scripts/update_version.py --check

      - name: Check citation metadata for known-wrong values
        run: python scripts/check_citation_metadata.py

      - name: Check README test badge consistency
        run: |
          pip install -e ".[dev]" -q
          python scripts/update_badges.py --check

      - name: Generate statusboard
        run: python scripts/generate_statusboard.py --output statusboard.json

      - name: Check statusboard health
        run: |
          python -c "
          import json, sys
          board = json.loads(open('statusboard.json').read())
          health = board['health']
          manifest = board['membrane']['manifest']
          print(f'Statusboard health: {health}')
          print(f'  Datasets pending: {manifest[\"datasets_pending\"]}')
          print(f'  Components missing: {manifest[\"components_missing\"]}')
          print(f'  Trilayer gaps: {board[\"trilayer\"][\"with_gaps\"]}')
          if health == 'red':
              print('::error::Statusboard health is RED (trilayer gaps detected)')
              sys.exit(1)
          elif health == 'yellow':
              print('::warning::Statusboard health is YELLOW (manifest gaps remain)')
          "

      - name: Upload statusboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statusboard
          path: statusboard.json
          retention-days: 30
