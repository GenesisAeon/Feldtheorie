# Claim-to-Evidence Registry
#
# Maps each top-level scientific claim to the machine-checkable artifact(s)
# that support it.  Validated by: python scripts/check_claim_evidence.py
#
# Structure:
#   claim_id   — stable identifier (never reused)
#   claim      — human-readable statement
#   source     — file where the claim is made
#   artifacts  — list of paths (relative to repo root) that constitute evidence
#   status     — supported | pending | falsified
#
# Governance: every PR that adds or modifies a claim must add an entry here.
# The CI workflow narrative-science-sync.yml verifies artifact existence.

meta:
  version: "1.0.0"
  updated: "2026-02-17"
  schema: "claim_id + claim + source + artifacts[] + status"

