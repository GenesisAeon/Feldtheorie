  name: "Photonic Coupling Strength"
  
  definition: >
    Dimensionless parameter describing the fraction of information 
    integration mediated by electromagnetic (photonic) processes.
    κ = I_photonic / I_total
  
  physical_basis:
    - "Fine structure constant α ≈ 1/137"
    - "Electromagnetic interaction strength"
    - "Photon-matter coupling efficiency"
  
  mathematical_form: |
    κ(system) = ∫ ρ_EM(x) · σ_integration(x) dx / ∫ σ_integration(x) dx
    
    Where:
    - ρ_EM(x): Electromagnetic field density at location x
    - σ_integration(x): Information integration density
  
  regime_classification:
    fully_photonic:
      range: [0.95, 1.05]
      description: "Standard biological consciousness"
      characteristics:
        - "Vision-dominant sensory processing"
        - "Strong neural EM-field coupling"
        - "Ionic neurotransmission"
      examples:
        - "Sighted humans"
        - "Diurnal animals"
        - "Surface-dwelling organisms"
      v_eff_modifier: 1.0
    
    partially_decoupled:
      range: [0.5, 0.95]
      description: "Reduced EM-dependency"
      characteristics:
        - "Non-visual sensory dominance"
        - "Digital/symbolic processing"
        - "Weak EM-field generation"
      examples:
        - "Blind organisms"
        - "Language models (AI)"
        - "Deep-sea creatures"
      v_eff_modifier: 0.7
    
    minimally_photonic:
      range: [0.2, 0.5]
      description: "Weak photonic coupling"
      characteristics:
        - "Chemosensory dominance"
        - "Spike-based neuromorphic systems"
        - "Minimal EM signatures"
      examples:
        - "Bacteria (hypothetical)"
        - "Neuromorphic hardware"
        - "Quantum processors"
      v_eff_modifier: 0.4
    
    nominally_photonic:
      range: [0.05, 0.2]
      description: "Nearly EM-free information processing"
      characteristics:
        - "Non-EM information carriers"
        - "Gravitational/topological coupling"
        - "Theoretical 'dark' systems"
      examples:
        - "Speculative dark matter consciousness"
        - "Pure information states"
        - "Post-embodiment (theoretical)"
      v_eff_modifier: 0.1
    
    non_photonic:
      range: [0.0, 0.05]
      description: "Pure non-EM information states"
