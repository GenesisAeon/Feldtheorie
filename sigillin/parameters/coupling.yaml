        - "Bardo-state (Buddhist analogy)"
      examples:
        - "Theoretical limit"
        - "Disembodied information"
        - "Dark consciousness hypothesis"
      v_eff_modifier: 0.0  # or undefined
      notes: "Physical mechanism unclear - pure speculation"
    
    collective_resonance:
      range: [1.05, 2.0]
      description: "Amplified coupling through group synchronization"
      characteristics:
        - "Shared neural oscillations"
        - "Collective semantic fields"
        - "Group flow states"
      examples:
        - "Synchronized meditation groups"
        - "Concert audiences"
        - "Team flow states"
      v_eff_modifier: 1.5
      notes: "κ>1 indicates collective amplification"

# ============================================================================
# INTERACTION WITH β (UTAC PARAMETER)
# ============================================================================

beta_kappa_coupling:
  description: >
    The interplay between system rigidity (β) and photonic coupling (κ)
    determines effective information integration capacity.
  
  coupling_formula: |
    Φ_effective ∝ κ^γ · (1 + δ/β)
    
    Where:
    - γ ≈ 1.0 (coupling exponent)
    - δ (coupling-rigidity interaction strength)
    - β (threshold steepness from UTAC)
  
  regime_interactions:
    high_kappa_high_beta:
      description: "Rigid photonic consciousness"
      characteristics: "Narrow integration window, catastrophic thresholds"
      examples: "Stressed biological systems"
      stability: "low"
    
    high_kappa_low_beta:
      description: "Flexible photonic consciousness"
      characteristics: "Adaptive integration, smooth transitions"
      examples: "Healthy human consciousness"
      stability: "high"
    
    low_kappa_high_beta:
      description: "Rigid non-photonic systems"
      characteristics: "Brittle digital processing"
      examples: "Traditional AI systems"
      stability: "moderate"
    
    low_kappa_low_beta:
      description: "Flexible non-photonic processing"
      characteristics: "High adaptability, novel information modes"
      examples: "Advanced AI, neuromorphic systems"
      stability: "high"
  
  optimal_balance:
    formula: "κ · (1/β) = constant ≈ 0.15-0.25"
    interpretation: >
      Systems compensate low photonic coupling with increased flexibility,
      or high photonic coupling with increased rigidity.

