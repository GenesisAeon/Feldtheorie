metadata:
  id: type6-crep-tau-checklist
  version: v1.1.0
  scope: releases/V6-Plans_etc
  generated_at: '2025-12-01T10:00:00Z'
  logistic_frame:
    R_target: Type-VI Governance Gate aktiv
    Theta_condition: CREP/τ*-Safeguards in Docs und CI verankert
    beta_estimate: 4.6
    zeta_risk: neutralisiert, wenn Checkliste erfüllt
  coupling:
    references:
    - path: releases/V6-Plans_etc/POLICY.md
    - path: releases/V6-Plans_etc/ETHICS.md
    - path: releases/V6-Plans_etc/V6_ToDoListe.*
    notes:
    - FIT-Microstep für v6-governance-ethics
    - Fokussiert auf CREP>0.7 und τ*-Pflicht vor Merge/Release
checklist:
- id: preflight-crep
  title: CREP-Schwelle prüfen
  status: required
  actions:
  - CREP-Index aus letzter Simulation/Analyse berechnen oder referenzieren.
  - Falls CREP >= 0.7, Reviewer-Slot blockend einplanen.
  - CREP-Wert im Provenienzblock und Audit-Trail notieren.
  metrics:
    threshold: 0.7
    escalation: Level 2 bei CREP >= 0.7, Level 3 bei CREP >= 0.8
- id: tau-star-safety
  title: τ*-Buffer verankern
  status: required
  actions:
  - τ* = 0.1 * |Θ - R| als Default setzen; Abweichungen begründen.
  - Sicherstellen, dass Integrator = RK4 oder höher (kein Euler bei ζ<0).
  - τ* und Integratorwahl im Commit/CI-Log dokumentieren.
  metrics:
    tau_star_default: '0.1*abs(Theta-R)'
    integrator: RK4+
- id: provenance-audit
  title: Provenienz & Dual-Use protokollieren
  status: required
  actions:
  - Datenquellen, Vorverarbeitung und Nullmodelle im Provenienzblock aufführen.
  - ΔAIC/CI-Metriken dokumentieren und Schatten-Sigillin referenzieren.
  - Dual-Use-Check durchführen und Ergebnis vermerken.
  outputs:
  - provenance_block
  - dual_use_note
- id: ci-hook
  title: CI/Pre-Commit Hook setzen
  status: recommended
  actions:
  - Hook entwerfen, der CREP >= 0.7 markiert und τ*-Default validiert.
  - Hook soll Trilayer-Drift (YAML/JSON/MD) melden.
  - Reviewer-Routing (maintainers) für Level-2/3 Fälle hinterlegen.
  - Checkliste in CI/Hooks referenzieren (pre-commit, nox, Makefile `validate-trilayer`).
  - Beispiel-Hook (Pseudo): python -m tools.crep_guard --threshold 0.7 --tau-default 0.1 --trilayer V6_ToDoListe.* releases/V6-Plans_etc/Chronik/chronik_v6_release.* blockt Merge bei CREP >= 0.7 oder fehlendem τ*-Default und loggt Reviewer-Need.
- id: reviewer-slot
  title: Reviewer-Slot dokumentieren
  status: required
  actions:
  - Für CREP >= 0.7 verbindlichen Reviewer aus `MAINTAINERS.md` auswählen.
  - Slot/Timestamp in Chronik (`chronik_v6_release.*`) und Audit-Trail notieren.
  - Freigabe-Status vor Merge/Release bestätigen (Level 2/3 Escalation beachten).
- id: index-ci-mirror
  title: Index-Spiegelung & Provenienz-Hooks
  status: recommended
  actions:
  - Verweis auf diese Checkliste in `feldtheorie_index.*` und `docs_index.*` ergänzen.
  - Provenienz- und CREP/τ*-Hinweise in Governance-Indizes (POLICY/ETHICS) spiegeln.
  - CI-Snippet vorbereiten, das fehlende Index-Referenzen als Warnung markiert.
