[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "feldtheorie"
version = "7.0.2"
description = "P70: Reproducibility harness for the Universal Threshold Field programme."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Universal Threshold Field Collective" }
]
keywords = ["logistic", "threshold-field", "resonance", "climate", "membrane"]
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11,<1.16",
  "pandas>=2.1,<2.4",
  "statsmodels>=0.14,<0.15",
  "matplotlib>=3.8,<3.11",
  "scikit-learn>=1.4,<1.8",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.20,<5",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "black>=24.4,<27",
  "mypy>=1.10,<1.20",
  "nox>=2024.4.15,<2025.12",
  "pytest>=8.2,<10",
  "pytest-cov>=4.1,<8",
  "ruff>=0.5.0,<0.15",
]
docs = [
  "myst-parser>=2.0,<5",
  "sphinx>=7.3,<9",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "pymdown-extensions>=10.7,<11",
]
api = [
  "fastapi>=0.104,<0.129",
  "uvicorn[standard]>=0.24,<0.41",
  "httpx>=0.25",
  "websockets>=12.0,<17",
]
llm = [
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]
all = [
  "black>=24.4,<27",
  "mypy>=1.10,<1.20",
  "nox>=2024.4.15,<2025.12",
  "pytest>=8.2,<10",
  "pytest-cov>=4.1,<8",
  "ruff>=0.5.0,<0.15",
  "myst-parser>=2.0,<5",
  "sphinx>=7.3,<9",
  "fastapi>=0.104,<0.129",
  "uvicorn[standard]>=0.24,<0.41",
  "httpx>=0.25",
  "websockets>=12.0,<17",
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
# Unified CLI (Preferred)
utac = "cli.main:main"

# Legacy CLI scripts (Deprecated - use `utac` instead)
utf-batch = "analysis.resonance_batch_runner:main"
utf-planetary-summary = "analysis.planetary_tipping_elements_fit:main"
utf-resonance-cohort = "analysis.resonance_cohort_summary:main"
utf-potential-cascade = "analysis.potential_cascade_lab:main"
utf-preset-guard = "analysis.preset_alignment_guard:main"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "models", "cli"]
include = [
  "analysis/**/*.py",
  "models/**/*.py",
  "cli/**/*.py",
  "analysis/results/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "analysis",
  "models",
  "tests",
  "docs",
  "data",
  "diagrams",
  "simulator",
  "Docs",
  "codexfeedback.json",
  "codexfeedback.yaml",
  "codexfeedback.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Ensure pytest-asyncio fixtures default to function scope to avoid deprecation warnings
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["analysis", "models", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert usage is expected in pytest
    "S311",  # non-cryptographic random is intentional in physics simulations
    "S605",  # os.system("cls"/"clear") screen-clear calls use hardcoded literals, no injection risk
    "S105",  # "password"-like names (e.g. consent_token) are test/session ids, not credentials
    "S106",  # same as S105, for keyword-argument form
    "S107",  # same as S105, for default-argument form
    "E501",  # line length is a formatting nit, not a correctness issue
    "E402",  # late imports are deliberate (sys.path manipulation precedes them)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]  # S603: subprocess.run([sys.executable, ...]) with hardcoded args, no untrusted input

[tool.coverage.run]
source = ["analysis", "models"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# Suppress missing-stub noise for optional extras (api, llm) and third-party
# packages not installed in the default dev environment.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party libraries used under src/ with no bundled type stubs and no
# stub packages installed in CI (ci.yml only installs .[dev], not
# pandas-stubs/types-tqdm/types-requests). Suppressing missing-import
# noise for these specific packages, not disabling type-checking of our
# own code that uses them.
module = ["pandas", "pandas.*", "tqdm", "tqdm.*", "plotly", "plotly.*", "requests", "requests.*"]
ignore_missing_imports = true

# === Diamond-Propagation: added project.urls & Zenodo ===
[project.urls]
Homepage = "https://github.com/GenesisAeon/Feldtheorie"
Documentation = "https://genesisaeon.github.io/Feldtheorie"
Zenodo = "https://doi.org/10.5281/zenodo.XXXXXXXX"  # <- enter your DOI

