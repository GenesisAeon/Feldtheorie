[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "feldtheorie"
version = "5.0.0"
description = "Reproducibility harness for the Universal Threshold Field programme."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Universal Threshold Field Collective" }
]
keywords = ["logistic", "threshold-field", "resonance", "climate", "membrane"]
dependencies = [
  "numpy>=2.2.6,<2.3",
  "scipy>=1.15.3,<1.16",
  "pandas>=2.3.3,<2.4",
  "statsmodels>=0.14.6,<0.15",
  "matplotlib>=3.10.8,<3.11",
  "scikit-learn>=1.7.2,<1.8",
  "pyyaml>=6.0.3,<7",
  "jsonschema>=4.26.0,<5",
  "typer>=0.24.1,<1",
  "rich>=15.0.0,<16",
  "requests>=2.33.1,<3",
]

[project.optional-dependencies]
dev = [
  "black>=26.3.1,<27",
  "mypy>=1.20.1,<1.21",
  "nox>=2026.4.10,<2026.5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.10,<0.16",
]
docs = [
  "myst-parser>=4.0.1,<5",
  "sphinx>=8.1.3,<9",
]
api = [
  "fastapi>=0.135.3,<0.136",
  "uvicorn[standard]>=0.44.0,<0.45",
  "httpx>=0.28.1",
  "websockets>=16.0,<17",
]
llm = [
  "openai>=2.31.0,<3",
  "python-dotenv>=1.2.2,<2",
]
all = [
  "black>=26.3.1,<27",
  "mypy>=1.20.1,<1.21",
  "nox>=2026.4.10,<2026.5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.10,<0.16",
  "myst-parser>=4.0.1,<5",
  "sphinx>=8.1.3,<9",
  "fastapi>=0.135.3,<0.136",
  "uvicorn[standard]>=0.44.0,<0.45",
  "httpx>=0.28.1",
  "websockets>=16.0,<17",
  "openai>=2.31.0,<3",
  "python-dotenv>=1.2.2,<2",
]

[project.scripts]
# Unified CLI (Preferred)
utac = "cli.main:main"

# Legacy CLI scripts (Deprecated - use `utac` instead)
utf-batch = "analysis.resonance_batch_runner:main"
utf-planetary-summary = "analysis.planetary_tipping_elements_fit:main"
utf-resonance-cohort = "analysis.resonance_cohort_summary:main"
utf-potential-cascade = "analysis.potential_cascade_lab:main"
utf-preset-guard = "analysis.preset_alignment_guard:main"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "models", "cli"]
include = [
  "analysis/**/*.py",
  "models/**/*.py",
  "cli/**/*.py",
  "analysis/results/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "analysis",
  "models",
  "tests",
  "docs",
  "data",
  "diagrams",
  "simulator",
  "Docs",
  "codexfeedback.json",
  "codexfeedback.yaml",
  "codexfeedback.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Ensure pytest-asyncio fixtures default to function scope to avoid deprecation warnings
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["analysis", "models", "tests"]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["analysis", "models"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# === Diamond-Propagation: added project.urls & Zenodo ===
[project.urls]
Homepage = "https://github.com/GenesisAeon/Feldtheorie"
Documentation = "https://genesisaeon.github.io/Feldtheorie"
Zenodo = "https://doi.org/10.5281/zenodo.XXXXXXXX"  # <- enter your DOI

