[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "feldtheorie"
version = "5.0.0"
description = "Reproducibility harness for the Universal Threshold Field programme."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Universal Threshold Field Collective" }
]
keywords = ["logistic", "threshold-field", "resonance", "climate", "membrane"]
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11,<1.16",
  "pandas>=2.1,<2.4",
  "statsmodels>=0.14,<0.15",
  "matplotlib>=3.8,<3.11",
  "scikit-learn>=1.4,<1.8",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.20,<5",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "black>=24.4,<26",
  "mypy>=1.10,<1.19",
  "nox>=2024.4.15,<2025.12",
  "pytest>=8.2,<10",
  "pytest-cov>=4.1,<8",
  "ruff>=0.5.0,<0.15",
]
docs = [
  "myst-parser>=2.0,<5",
  "sphinx>=7.3,<9",
]

[project.scripts]
utf-batch = "analysis.resonance_batch_runner:main"
utf-planetary-summary = "analysis.planetary_tipping_elements_fit:main"
utf-resonance-cohort = "analysis.resonance_cohort_summary:main"
utf-potential-cascade = "analysis.potential_cascade_lab:main"
utf-preset-guard = "analysis.preset_alignment_guard:main"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "models"]
include = [
  "analysis/**/*.py",
  "models/**/*.py",
  "analysis/results/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "analysis",
  "models",
  "tests",
  "docs",
  "data",
  "diagrams",
  "simulator",
  "Docs",
  "codexfeedback.json",
  "codexfeedback.yaml",
  "codexfeedback.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["analysis", "models", "tests"]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["analysis", "models"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
