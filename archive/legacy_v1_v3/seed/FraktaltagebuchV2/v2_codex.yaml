    - Observed exponential spread in β-values (2.5 to 16.3)

    **Methodik:**

    1. Dataset: 15 β-values (theta_plasticity β=2.5 → urban_heat β=16.3)

    2. Ratio Analysis: Compute r_i = β_{i+1} / β_i, test H₀: mean(r_i) = Φ

    3. t-Test: One-sample t-test against Φ (α=0.05)

    4. Log-Regression: log(β) ~ n, compare slope vs log(Φ) = 0.481

    **Implementation:**

    - Python script: beta_phi_scaling_test.py (173 LOC)

    - Libraries: numpy, scipy, pandas, matplotlib

    - Output: JSON summary + visualization plot

    - Acceptance Criteria: |mean_ratio - Φ| < 0.15 AND R² > 0.80

