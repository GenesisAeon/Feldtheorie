mode: "Recursive Data Analysis"
mode_id: "data"
description: "Context for data ingestion, analysis, and statistical validation"

# Folder patterns that match this mode
folder_patterns:
  - "data/"
  - "analysis/"
  - "results/"
  - "output/"
  - "notebooks/"

# Mode-specific content for templates
agents_content: |
  ### Data Analysis Context

  This is a **data-centric context**. Agents working here focus on:
  - Data provenance and lineage
  - Statistical validity and null hypothesis testing
  - Privacy and ethical data handling
  - Reproducibility of analyses
  - Transparency in methods

  **Active Agent Roles:**
  - Data Curator: Manages data ingestion, cleaning, and metadata
  - Statistical Analyst: Computes ΔAIC, CIs, residual diagnostics
  - Privacy Officer: Ensures GDPR/HIPAA compliance, removes PII
  - Reproducibility Engineer: Pins seeds, versions, environment specs

workflow_content: |
  1. **Before analysis:** Check data provenance, read metadata files
  2. **During analysis:** Document stochastic seeds, export diagnostics
  3. **After analysis:** Compute null models, bootstrap CIs, residual plots
  4. **Pre-commit:** Ensure metadata is complete, no PII in outputs

ethics_content: |
  ### Data Ethics

  - **Open Data Only**: Use only openly licensed datasets (CC-BY, CC0, etc.)
  - **Provenance Required**: Every dataset must have a `.metadata.json` file
  - **Privacy First**: Remove PII before ingestion; anonymize if necessary
  - **Uncertainty Transparency**: Report confidence intervals, p-values, ΔAIC
  - **Null Models**: Always compare against baseline (linear, power law, etc.)

data_governance: |
  - All datasets must include `*.metadata.json` with:
    - Source URL and license
    - Date of acquisition
    - Preprocessing steps
    - Known limitations
  - Raw data is immutable (store in `data/raw/`)
  - Processed data is versioned (store in `data/processed/vX.Y/`)
  - Personal identifiers are NEVER committed

misuse_risks: |
  | Risk | Mitigation |
  |------|------------|
  | P-hacking | Pre-register hypotheses; document all tests run |
  | Cherry-picking | Report all models tested, including null models |
  | Data leakage | Use strict train/test splits; never touch test data |
  | Overfitting | Cross-validate; report out-of-sample metrics |
  | License violations | Check and document licenses in metadata |

architecture_content: |
  ### Data Architecture

  ```
  {{PATH}}
  ├── raw/                 (Immutable source data)
  ├── processed/           (Cleaned, versioned data)
  ├── interim/             (Intermediate transformations)
  ├── external/            (Third-party data)
  ├── metadata/            (Provenance and schemas)
  └── README.md            (Data dictionary)
  ```

  **Data Flow:**
  1. Ingest → raw/
  2. Clean → interim/
  3. Transform → processed/
  4. Analyze → results/
  5. Publish → docs/

policy_content: |
  ### Data Policy

  1. **Metadata Mandatory**: No data without `.metadata.json`
  2. **Immutable Raw Data**: Never modify files in `raw/`
  3. **Versioned Outputs**: Tag processed datasets with semantic versions
  4. **Statistical Rigor**: Always compute ΔAIC and bootstrap CIs
  5. **Privacy Compliance**: PII removal audited before commit

quality_gates: |
  - [ ] Metadata file exists and is complete
  - [ ] Data provenance documented (source, license, date)
  - [ ] No PII in committed files
  - [ ] Null models defined and tested
  - [ ] Statistical diagnostics exported (ΔAIC, R², residuals)
  - [ ] Stochastic seeds logged
  - [ ] Confidence intervals computed

automation_hooks: |
  - **Pre-commit**: Scan for PII (email, SSN, names)
  - **CI Pipeline**: Validate metadata schemas
  - **Nightly**: Re-run key analyses with different seeds
  - **Release**: Archive datasets with DOI (Zenodo integration)
