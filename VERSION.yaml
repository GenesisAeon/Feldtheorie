# Single source of truth for the Feldtheorie package version.
# All version references (pyproject.toml, README badges, release metadata)
# are derived from this file via scripts/update_version.py.
#
# After editing, run:  python scripts/update_version.py --check
# or:                  python scripts/update_version.py --apply
#
# See docs/release_channels.md for the full channel convention.

# ---------------------------------------------------------------------------
# Package Channel  — Python package SemVer (pip / PyPI)
# Governs: pyproject.toml, pip install, Zenodo archive
# ---------------------------------------------------------------------------
package_version: "7.0.2"

# ---------------------------------------------------------------------------
# Research Channel — Narrative release labels for the research programme
# Governs: README badges, release notes, scientific publications
# ---------------------------------------------------------------------------
release_stream: "v13.0.0"
stable_version: "7.0.2"
alpha_version: "9.0.0-alpha"
