name: AFET-HfO2-Neuromorphic-Interface-v0
inputs:
  pulse_sequence: list of pulses with voltage_v, width_ns, channel_id
  sensor_feedback: optional current/resistance/temperature dictionary
  calibration_profile: sigma_phi_target and beta profile map
outputs:
  state_embedding: latent vector for AFET runtime
  sigma_phi_estimate: metastability estimate
  diagnostics:
    - drift_score
    - retention_error
    - device_flags
constraints:
  latency_ms: "<=5"
  thermal_window_c: "0-85"
  critical_sigma_phi: 0.055
notes:
  - Placeholder contract pending hardware partner alignment.
