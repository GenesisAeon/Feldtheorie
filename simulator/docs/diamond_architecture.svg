<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .module-box { fill: #2c3e50; stroke: #3498db; stroke-width: 2; }
      .module-box:hover { fill: #34495e; cursor: pointer; }
      .module-text { fill: #ecf0f1; font-family: 'Courier New', monospace; font-size: 14px; text-anchor: middle; }
      .flow-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .flow-label { fill: #95a5a6; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .title-text { fill: #ecf0f1; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .layer-label { fill: #bdc3c7; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="400" y="30" class="title-text">UTAC Simulator Diamond Architecture</text>

  <!-- Layer 1: Models (Top) -->
  <text x="50" y="80" class="layer-label">Models Layer</text>
  <g id="models-layer">
    <a href="../models/utac_type6_implosive.py" target="_blank">
      <rect x="320" y="60" width="160" height="50" class="module-box" rx="5"/>
      <text x="400" y="90" class="module-text">utac_type6</text>
    </a>
  </g>

  <!-- Layer 2: Simulation (Left & Right) -->
  <text x="50" y="200" class="layer-label">Simulation Layer</text>
  <g id="simulation-layer">
    <a href="../simulation/genesis_cube.py" target="_blank">
      <rect x="100" y="180" width="160" height="50" class="module-box" rx="5"/>
      <text x="180" y="210" class="module-text">genesis_cube</text>
    </a>

    <a href="../simulation/tesseract_timeslices.py" target="_blank">
      <rect x="540" y="180" width="160" height="50" class="module-box" rx="5"/>
      <text x="620" y="210" class="module-text">tesseract_slices</text>
    </a>
  </g>

  <!-- Layer 3: Pipeline (Center Left & Right) -->
  <text x="50" y="320" class="layer-label">Pipeline Layer</text>
  <g id="pipeline-layer">
    <a href="../pipelines/wavefunction/psi_field.py" target="_blank">
      <rect x="100" y="300" width="160" height="50" class="module-box" rx="5"/>
      <text x="180" y="325" class="module-text">psi_field.py</text>
      <text x="180" y="340" class="module-text" style="font-size: 11px;">ψ-wavefunction</text>
    </a>

    <a href="./src/utils/physicsIntegrator.ts" target="_blank">
      <rect x="540" y="300" width="160" height="50" class="module-box" rx="5"/>
      <text x="620" y="325" class="module-text">RK4 Integrator</text>
      <text x="620" y="340" class="module-text" style="font-size: 11px;">JS/TypeScript</text>
    </a>
  </g>

  <!-- Layer 4: UX Components (Bottom Left, Center, Right) -->
  <text x="50" y="440" class="layer-label">UX Layer</text>
  <g id="ux-layer">
    <a href="./src/components/PhasePortrait.tsx" target="_blank">
      <rect x="50" y="420" width="150" height="50" class="module-box" rx="5"/>
      <text x="125" y="445" class="module-text">PhasePortrait</text>
      <text x="125" y="460" class="module-text" style="font-size: 10px;">Visualization</text>
    </a>

    <a href="./src/hooks/useAudioSonification.ts" target="_blank">
      <rect x="220" y="420" width="150" height="50" class="module-box" rx="5"/>
      <text x="295" y="445" class="module-text">Audio Sonify</text>
      <text x="295" y="460" class="module-text" style="font-size: 10px;">Web Audio API</text>
    </a>

    <a href="./src/components/CSVDropZone.tsx" target="_blank">
      <rect x="390" y="420" width="150" height="50" class="module-box" rx="5"/>
      <text x="465" y="445" class="module-text">CSV Import</text>
      <text x="465" y="460" class="module-text" style="font-size: 10px;">Drag & Drop</text>
    </a>

    <a href="./src/components/CREPDashboard.tsx" target="_blank">
      <rect x="560" y="420" width="150" height="50" class="module-box" rx="5"/>
      <text x="635" y="445" class="module-text">CREP Monitor</text>
      <text x="635" y="460" class="module-text" style="font-size: 10px;">Stability</text>
    </a>
  </g>

  <!-- Layer 5: Documentation (Bottom) -->
  <text x="50" y="560" class="layer-label">Docs Layer</text>
  <g id="docs-layer">
    <a href="../docs/v6_wavefunction_theory.md" target="_blank">
      <rect x="150" y="540" width="160" height="40" class="module-box" rx="5"/>
      <text x="230" y="565" class="module-text">Theory Docs</text>
    </a>

    <a href="./llms.txt" target="_blank">
      <rect x="490" y="540" width="160" height="40" class="module-box" rx="5"/>
      <text x="570" y="565" class="module-text">llms.txt</text>
    </a>
  </g>

  <!-- Flow Arrows -->
  <!-- Models → Simulation -->
  <path d="M 360 110 L 220 180" class="flow-arrow"/>
  <path d="M 440 110 L 580 180" class="flow-arrow"/>
  <text x="290" y="150" class="flow-label">σ(β(R-Θ))</text>
  <text x="510" y="150" class="flow-label">τ*-buffer</text>

  <!-- Simulation → Pipeline -->
  <path d="M 180 230 L 180 300" class="flow-arrow"/>
  <path d="M 620 230 L 620 300" class="flow-arrow"/>
  <text x="120" y="270" class="flow-label">Ψ-field</text>
  <text x="660" y="270" class="flow-label">RK4</text>

  <!-- Pipeline → UX -->
  <path d="M 180 350 L 125 420" class="flow-arrow"/>
  <path d="M 200 350 L 295 420" class="flow-arrow"/>
  <path d="M 600 350 L 465 420" class="flow-arrow"/>
  <path d="M 620 350 L 635 420" class="flow-arrow"/>
  <text x="150" y="390" class="flow-label">|ψ|²</text>
  <text x="250" y="390" class="flow-label">∇S</text>
  <text x="530" y="390" class="flow-label">state</text>
  <text x="660" y="390" class="flow-label">CREP</text>

  <!-- UX → Docs -->
  <path d="M 125 470 L 200 540" class="flow-arrow"/>
  <path d="M 635 470 L 580 540" class="flow-arrow"/>
  <text x="160" y="510" class="flow-label">theory</text>
  <text x="610" y="510" class="flow-label">context</text>

  <!-- Cross-connections -->
  <path d="M 320 85 Q 230 325 260 420" class="flow-arrow" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="270" y="250" class="flow-label" opacity="0.7">direct</text>

  <!-- Legend -->
  <g id="legend" transform="translate(20, 100)">
    <rect x="0" y="0" width="80" height="60" fill="#1a1a1a" stroke="#3498db" stroke-width="1" rx="3"/>
    <text x="5" y="15" style="fill: #ecf0f1; font-size: 11px; font-weight: bold;">Legend:</text>
    <line x1="5" y1="25" x2="25" y2="25" stroke="#e74c3c" stroke-width="2"/>
    <text x="30" y="29" style="fill: #95a5a6; font-size: 10px;">Data Flow</text>
    <line x1="5" y1="40" x2="25" y2="40" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="30" y="44" style="fill: #95a5a6; font-size: 10px;">Direct Link</text>
    <text x="5" y="55" style="fill: #95a5a6; font-size: 9px; font-style: italic;">Click boxes!</text>
  </g>

  <!-- Info Box -->
  <g id="info" transform="translate(680, 100)">
    <rect x="0" y="0" width="110" height="100" fill="#1a1a1a" stroke="#27ae60" stroke-width="1" rx="3"/>
    <text x="5" y="15" style="fill: #27ae60; font-size: 11px; font-weight: bold;">Architecture:</text>
    <text x="5" y="30" style="fill: #ecf0f1; font-size: 9px;">5 Layers</text>
    <text x="5" y="43" style="fill: #ecf0f1; font-size: 9px;">13 Modules</text>
    <text x="5" y="56" style="fill: #ecf0f1; font-size: 9px;">Python + TS</text>
    <text x="5" y="69" style="fill: #ecf0f1; font-size: 9px;">RK4 Solver</text>
    <text x="5" y="82" style="fill: #ecf0f1; font-size: 9px;">Type-VI Ready</text>
    <text x="5" y="95" style="fill: #95a5a6; font-size: 8px; font-style: italic;">v6.0.0-beta</text>
  </g>
</svg>
