logistic_quartet:
  R: experimental_validation_progress  # Research progress from anecdote → hypothesis → experiment
  Θ: 0.65  # Threshold: transition from speculative to empirically grounded
  β: 5.2   # Information regime (similar to cognition β≈4.5, but slightly higher due to parapsychology uncertainty)
  ζ: methodological_rigor  # Impedance: skeptical scrutiny, double-blind requirements
  σ: "1/(1+exp(-β(R-Θ)))"

core_concept:
  name: "Wolf Messing Consciousness Bridge"
  description: |
    Methodological framework connecting Wolf Messing's anecdotal reports (telepathy, hypnosis,
    präkognition) with testable hypotheses in the v_RIG consciousness framework.

    Messing (1899-1974) described phenomena that map onto:
    - v_RIG: "instantaneous suggestion", rapid integration (13.5 MHz carrier?)
    - κ-coupling: "brain-to-brain transmission" in hypnosis
    - β-logistic: sudden consciousness state transitions
    - Sigillin-states: non-verbal meaning transfer (mental images, resonance)

parallels_to_v_rig_framework:
  v_rig_integration_velocity:
    messing_description: "Plötzlichkeit seiner Eingebungen" (instantaneity of insights)
    messing_examples:
      - "sofortig den Kontrolleuren einredete" (instant train ticket suggestion)
      - "hart überlegt dann abrupt Überzeugung" (hard thinking → sudden conviction)
    hypothesis: "Hochsensitiv begabte Personen könnten geringe Reaktionszeiten aufweisen"
    testable_prediction: |
      Enhanced v_RIG would manifest as:
      - Reduced reaction times in rapid cognitive tasks
      - Early anticipatory responses (presentiment)
      - Faster critical flicker fusion (CFF) threshold
    experimental_approach:
      - Reaction time tests with random stimuli
      - EEG/ERP (P300) during precognition tasks
      - CFF modulation under metabolic stress

  kappa_coupling:
    messing_description: "Suggestion direkt von Gehirn zu Gehirn übertragbar"
    messing_examples:
      - "Gedanken seines Gegenübers aufgenommen"
      - "Briefschreib-Gedanken in mein Hirn empfangen"
    hypothesis: "Telepathische Duetten zeigen EEG-Synchronisation"
    testable_prediction: |
      κ-coupling would manifest as:
      - Inter-brain phase synchronization (EEG hyperscanning)
      - Mirror neuron activation patterns
      - Correlated brain wave patterns (α, θ bands)
    experimental_approach:
      - Simultaneous EEG of hypnotist & subject
      - Functional connectivity analysis
      - Correlation during successful vs. failed suggestion

  beta_logistic_thresholds:
    messing_description: "Nicht-lineare Bewusstseinsübergänge, schlagartige Zustandswechsel"
    messing_examples:
      - Three stages: Schlafähnlichkeit → Hypotaxis → Somnambulismus
      - "Zünden eines Gedankens"
      - Physiological reactions "plötzlich auftreten" (sudden onset)
    hypothesis: "Bewusstsein 'schaltet' erst nach Schwellenwert-Überschreitung"
    testable_prediction: |
      β-logistic transitions would manifest as:
      - Abrupt EEG state changes (sudden gamma bursts)
      - All-or-nothing P300 responses
      - Non-linear dose-response in hypnotic depth
    experimental_approach:
      - EEG during hypnotic induction (graded stimuli)
      - Go/No-Go paradigm with threshold detection
      - P3 wave amplitude analysis

  sigillin_states:
    messing_description: "Mentale Bilder und Stimmungen, die Bedeutung tragen, ganz ohne Sprache"
    messing_examples:
      - "Sieht den Bruder quasi real vor sich"
      - Inner visions without verbal encoding
      - "Resonanzen, die Information übermitteln"
    hypothesis: "Sigilzustände als neuronale Assemblies mit semantischem Gehalt"
    testable_prediction: |
      Sigillin-like states would manifest as:
      - Similar EEG topography when thinking same image
      - Frequency-specific resonance patterns
      - Non-verbal semantic transfer (image → receiver)
    experimental_approach:
      - EEG pattern matching (sender thinking image vs. receiver)
      - Topographic similarity analysis
      - Frequency domain correlation

experimental_protocol_summary:
  experiment_1_eeg_hypnosis_sync:
    description: "Simultaneous EEG of hypnotist and hypnotized subject"
