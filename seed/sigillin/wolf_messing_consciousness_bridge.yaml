    - "Historisch umstritten (Einstein-Freud Meeting zeitlich unmöglich)"
    - "Politische Instrumentalisierung in Sowjetunion"
    - "Messing selbst betont materialistischen Ansatz"

  methodological_requirements:
    - "Strenge Doppelblind-Kontrollbedingungen"
    - "Psi-Effekte erfahrungsgemäß klein → hohe statistische Power nötig"
    - "Reproduzierbarkeit kritisch"
    - "Quantitative Messung: EEG, fMRI, GSR, Herzfrequenz"

  falsification_criteria:
    - "Keine EEG-Synchronisation über Baseline → κ-Kopplung widerlegt"
    - "Keine RT-Vorteile bei 'Medien' → v_RIG-Enhancement widerlegt"
    - "Keine Presentiment-Effekte → Präkognition-Hypothese widerlegt"
    - "Lineare Hypnose-Tiefe (kein Schwellenwert) → β-Logistik widerlegt"

