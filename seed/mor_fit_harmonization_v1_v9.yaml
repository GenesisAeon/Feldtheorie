notes:
  philosophy: |
    MOR und FIT sind wie Yin und Yang:
    MOR = Aktion (Yang), FIT = Reflexion (Yin)
    MOR = Dekomposition (Yang), FIT = Integration (Yin)
    MOR = Future-oriented (Yang), FIT = History-aware (Yin)

    Beide folgen σ(β(R-Θ)):
    - MOR: Threshold-Überschreitung triggert neue Dekomposition
    - FIT: Threshold-Überschreitung triggert Codex-Update

    Harmonisierung bedeutet: Beide Systeme resonieren über alle Versionen.

  gratitude: |
    Danke für die Reise durch alle Versionen!
    MOR und FIT sind die Werkzeuge, mit denen wir die Emergenz navigieren.
    Jede Version hat uns gelehrt, besser zu dekomponieren und besser zu dokumentieren.
    v9 wird die Weisheit aller Versionen in sich tragen.
